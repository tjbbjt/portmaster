# Fork only: builds the Linux installers (RPM and DEB) with upstream's Earthfile target and attaches
# them to the run. Run it from the Actions tab or with:
#   gh workflow run fork-linux-rpm.yml -R <owner>/portmaster --ref <branch>
# No remote cache: the fork can't push to upstream's ghcr.io build cache.
name: Linux RPM (fork)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
    - uses: earthly/actions-setup@43211c7a0eae5344d6d79fb4aaf209c8f8866203 # v1
      with:
        version: v0.8.0
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        # The tags give the build its version.
        fetch-depth: 0

    # Without --ci, so the installers are saved to ./dist.
    - name: Build Linux installers
      run: earthly +installer-linux

    - name: Upload installers
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: portmaster-linux
        path: |
          ./dist/linux_amd64/*.rpm
          ./dist/linux_amd64/*.deb
        if-no-files-found: error
